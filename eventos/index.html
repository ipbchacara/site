<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Presbiteriana Chácara Parreiral</title>
<meta name="description" content="Agenda de cultos, Escola Bíblica, reuniões de oração e eventos especiais da Igreja Presbiteriana Chácara Parreiral.">
<meta name="theme-color" content="#15240F">
<link rel="icon" type="image/png" href="/Imagens/Logos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/agenda.js" defer></script>
<style>
  :root { --c-culto: #BE1E2D; --c-escola: #2E6A9E; --c-oracao: #3F6005; --c-especial: #D9822B; }
  .agenda-wrap { max-width: 920px; margin: 0 auto; }
  .agenda-barra { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .abas { display: inline-flex; background: #fff; border: 1px solid var(--linha); border-radius: 999px; padding: 4px; }
  .abas button { font: inherit; font-weight: 700; font-size: .9rem; border: 0; background: none; padding: .55rem 1.3rem; border-radius: 999px; cursor: pointer; color: var(--texto-suave); }
  .abas button[aria-selected="true"] { background: var(--videira); color: #fff; }
  .legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--texto-suave); }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .legenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .painel { background: #fff; border: 1px solid var(--linha); border-radius: var(--raio-g); padding: clamp(16px, 3vw, 32px); }
  .nav-periodo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .nav-periodo h2 { font-size: 1.35rem; margin: 0; text-align: center; }
  .seta { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linha); background: var(--pergaminho); color: var(--videira); cursor: pointer; font-size: 1.1rem; display: grid; place-items: center; }
  .seta:hover { background: var(--videira); color: #fff; border-color: var(--videira); }
  .faixa-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 24px; }
  .dia-btn { font: inherit; border: 1px solid transparent; background: none; border-radius: 14px; padding: 10px 0 12px; cursor: pointer; text-align: center; color: var(--texto); }
  .dia-btn:hover { background: var(--pergaminho); }
  .dia-btn .sem { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
  .dia-btn .num { display: block; font-family: var(--f-titulo); font-size: 1.4rem; margin-top: 2px; }
  .dia-btn .pontos { display: flex; gap: 3px; justify-content: center; height: 6px; margin-top: 4px; }
  .dia-btn .pontos i { width: 6px; height: 6px; border-radius: 50%; }
  .dia-btn.hoje .num { color: var(--uva); }
  .dia-btn.sel { background: var(--videira); color: #fff; }
  .dia-btn.sel .sem { color: #B6C4A8; }
  .dia-btn.sel .num { color: #fff; }
  .titulo-dia { font-family: var(--f-titulo); font-size: 1.2rem; color: var(--videira); margin: 0 0 14px; }
  .item { display: grid; grid-template-columns: 4px 1fr auto; gap: 16px; align-items: center; padding: 16px 18px 16px 0; border-radius: 12px; background: var(--pergaminho); margin-bottom: 10px; overflow: hidden; }
  .item .barra { align-self: stretch; }
  .item h3 { font-size: 1.05rem; margin: 0 0 2px; }
  .item .meta { font-size: .88rem; color: var(--texto-suave); }
  .item a { font-weight: 700; font-size: .88rem; }
  .vazio { text-align: center; padding: 32px 16px; color: var(--texto-suave); font-style: italic; }
  .cab-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cab-mes div { text-align: center; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
  .grade-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cel { font: inherit; text-align: left; background: var(--pergaminho); border: 1px solid transparent; border-radius: 10px; min-height: 84px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; color: var(--texto); }
  .cel:hover { border-color: var(--folha); }
  .cel .n { font-size: .82rem; font-weight: 700; }
  .cel.hoje { background: #EEF2E3; border-color: var(--folha); }
  .cel.hoje .n { color: var(--uva); }
  .cel.fora { opacity: .35; }
  .cel .pils { display: contents; }
  .pilula { font-size: .66rem; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Movimento: troca de aba, dia e mês sem saltos */
  .abas button, .dia-btn, .cel, .seta { transition: background-color .25s ease, color .25s ease, border-color .25s ease, transform .3s var(--ease); }
  .dia-btn:active, .cel:active, .seta:active { transform: scale(.94); transition-duration: .1s; }
  .painel:not([hidden]) { animation: surge .4s var(--ease) both; }
  #eventos-dia > * { animation: surge .45s var(--ease) both; }
  #eventos-dia > :nth-child(2) { animation-delay: .05s; }
  #eventos-dia > :nth-child(3) { animation-delay: .1s; }
  #eventos-dia > :nth-child(n+4) { animation-delay: .15s; }
  .grade-mes .cel { animation: esmaece .35s ease both; }
  @media (max-width: 640px) {
    .cel { min-height: 54px; padding: 4px; }
    .pilula { font-size: 0; height: 6px; width: 6px; padding: 0; border-radius: 50%; display: inline-block; }
    .cel .pils { display: flex; gap: 3px; flex-wrap: wrap; }
    .dia-btn .num { font-size: 1.15rem; }
    .item { grid-template-columns: 4px 1fr; }
    .item .selo { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
<div id="site-header"></div>

<main id="conteudo">
  <section class="pagina-topo">
    <img class="simbolo-fundo" src="/assets/img/simbolo-branca.svg" alt="">
    <div class="container">
      <div class="sobretitulo">Agenda</div>
      <h1>Nossa programação</h1>
      <p class="lead">“Oh! Como é bom e agradável viverem unidos os irmãos!” — Salmos 133.1</p>
    </div>
  </section>

  <section class="secao" style="padding-top:48px">
    <div class="container agenda-wrap">
      <div class="agenda-barra">
        <div class="abas" role="tablist">
          <button role="tab" aria-selected="true" id="aba-semana" onclick="trocarAba('semana')">Semana</button>
          <button role="tab" aria-selected="false" id="aba-mes" onclick="trocarAba('mes')">Mês</button>
        </div>
        <div class="legenda">
          <span><i style="background:var(--c-culto)"></i>Culto</span>
          <span><i style="background:var(--c-escola)"></i>Escola Bíblica</span>
          <span><i style="background:var(--c-oracao)"></i>Oração</span>
          <span><i style="background:var(--c-especial)"></i>Especial</span>
        </div>
      </div>

      <div class="painel" id="vista-semana">
        <div class="nav-periodo">
          <button class="seta" onclick="mudarSemana(-1)" aria-label="Semana anterior">←</button>
          <h2 id="titulo-semana"></h2>
          <button class="seta" onclick="mudarSemana(1)" aria-label="Próxima semana">→</button>
        </div>
        <div class="faixa-semana" id="faixa-semana"></div>
        <div id="eventos-dia" aria-live="polite"></div>
      </div>

      <div class="painel" id="vista-mes" hidden>
        <div class="nav-periodo">
          <button class="seta" onclick="mudarMes(-1)" aria-label="Mês anterior">←</button>
          <h2 id="titulo-mes"></h2>
          <button class="seta" onclick="mudarMes(1)" aria-label="Próximo mês">→</button>
        </div>
        <div class="cab-mes"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
        <div class="grade-mes" id="grade-mes"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const COR = { culto: 'var(--c-culto)', escola: 'var(--c-escola)', oracao: 'var(--c-oracao)', especial: 'var(--c-especial)' };
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate() - hoje.getDay());
  let mesAtual = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  let diaSel = new Date(hoje);

  const mesmoDia = (a, b) => a.toDateString() === b.toDateString();
  const curto = d => d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');

  function renderSemana() {
    const fim = new Date(inicioSemana); fim.setDate(inicioSemana.getDate() + 6);
    document.getElementById('titulo-semana').textContent = curto(inicioSemana) + ' – ' + curto(fim);
    let html = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(inicioSemana); d.setDate(inicioSemana.getDate() + i);
      const evs = eventosDoDia(d);
      const cls = ['dia-btn', mesmoDia(d, hoje) && 'hoje', mesmoDia(d, diaSel) && 'sel'].filter(Boolean).join(' ');
      html += `<button class="${cls}" data-d="${dataISO(d)}" aria-pressed="${mesmoDia(d, diaSel)}">
        <span class="sem">${DIAS[d.getDay()]}</span><span class="num">${d.getDate()}</span>
        <span class="pontos">${evs.map(e => `<i style="background:${COR[e.tipo]}"></i>`).join('')}</span></button>`;
    }
    const faixa = document.getElementById('faixa-semana');
    faixa.innerHTML = html;
    faixa.querySelectorAll('button').forEach(b => b.onclick = () => { const [a, m, dd] = b.dataset.d.split('-').map(Number); diaSel = new Date(a, m - 1, dd); renderSemana(); });
    renderDia();
  }

  function renderDia() {
    const evs = eventosDoDia(diaSel);
    let txt = diaSel.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    txt = txt.charAt(0).toUpperCase() + txt.slice(1);
    const alvo = document.getElementById('eventos-dia');
    if (!evs.length) { alvo.innerHTML = `<p class="titulo-dia">${txt}</p><div class="vazio">Nenhuma programação neste dia.</div>`; return; }
    alvo.innerHTML = `<p class="titulo-dia">${txt}</p>` + evs.map(e => `
      <div class="item"><span class="barra" style="background:${COR[e.tipo]}"></span>
        <div><h3>${e.titulo}</h3><div class="meta">${e.hora}${e.sub ? ' · ' + e.sub : ''}${e.link ? ` · <a href="${e.link}">Saiba mais</a>` : ''}</div></div>
        <span class="selo ${e.tipo}">${e.selo}</span></div>`).join('');
  }

  function renderMes() {
    document.getElementById('titulo-mes').textContent = MESES[mesAtual.getMonth()] + ' ' + mesAtual.getFullYear();
    const ini = new Date(mesAtual); ini.setDate(1 - mesAtual.getDay());
    let html = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(ini); d.setDate(ini.getDate() + i);
      if (i >= 35 && d.getMonth() !== mesAtual.getMonth()) break;
      const evs = eventosDoDia(d);
      const cls = ['cel', mesmoDia(d, hoje) && 'hoje', d.getMonth() !== mesAtual.getMonth() && 'fora'].filter(Boolean).join(' ');
      html += `<button class="${cls}" data-d="${dataISO(d)}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}: ${evs.length ? evs.map(e => e.titulo).join(', ') : 'sem programação'}">
        <span class="n">${d.getDate()}</span><span class="pils">${evs.map(e => `<span class="pilula" style="background:${COR[e.tipo]}">${e.titulo.split(' ')[0]}</span>`).join('')}</span></button>`;
    }
    const grade = document.getElementById('grade-mes');
    grade.innerHTML = html;
    grade.querySelectorAll('button').forEach(b => b.onclick = () => {
      const [a, m, dd] = b.dataset.d.split('-').map(Number);
      diaSel = new Date(a, m - 1, dd);
      inicioSemana = new Date(diaSel); inicioSemana.setDate(diaSel.getDate() - diaSel.getDay());
      trocarAba('semana');
    });
  }

  window.mudarSemana = dir => { inicioSemana.setDate(inicioSemana.getDate() + dir * 7); diaSel = new Date(inicioSemana); renderSemana(); };
  window.mudarMes = dir => { mesAtual.setMonth(mesAtual.getMonth() + dir); renderMes(); };
  window.trocarAba = aba => {
    document.getElementById('aba-semana').setAttribute('aria-selected', aba === 'semana');
    document.getElementById('aba-mes').setAttribute('aria-selected', aba === 'mes');
    document.getElementById('vista-semana').hidden = aba !== 'semana';
    document.getElementById('vista-mes').hidden = aba !== 'mes';
    aba === 'mes' ? renderMes() : renderSemana();
  };

  renderSemana();
});
</script>
</body>
</html>
